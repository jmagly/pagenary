# GitHub's npm workflow owns public release assets. Mirror verified bytes back
# to the canonical Gitea release; no GitHub PAT or GitHub push is needed here.
name: Release (Gitea)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: 'Existing stable release tag to mirror (recovery)'
        required: true
        type: string
concurrency:
  group: gitea-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref, '-') }}
    name: Mirror verified release to Gitea
    runs-on: ubuntu-latest
    container: node:24.12.0@sha256:929c026d5a4e4a59685b3c1dbc1a8c3eb090aa95373d3a4fd668daa2493c8331
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_to_publish }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$TAG" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected stable CalVer tag'; exit 1; }
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --depth=1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify signed tag (opt-in)
        if: ${{ vars.REQUIRE_SIGNED_TAGS == 'true' }}
        env:
          GITHUB_REF: refs/tags/${{ steps.release_tag.outputs.tag }}
        run: bash tools/ci/verify-signed-tag.sh
      - name: Mirror GitHub npm release assets to Gitea
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GITEA_TOKEN: ${{ secrets.GT_TOKEN || secrets.NPM_TOKEN }}
        run: node tools/release/mirror-gitea-release.mjs
