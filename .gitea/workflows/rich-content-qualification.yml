name: Rich Content External Renderers

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/authoring-contract/**'
      - 'apps/publisher/scripts/build-tenants.js'
      - 'apps/publisher/scripts/lib/latex-page-*.js'
      - 'apps/publisher/scripts/lib/mermaid-build-adapter.js'
      - 'apps/publisher/scripts/lib/plantuml-renderer.js'
      - 'apps/publisher/scripts/lib/renderer-security.js'
      - 'apps/publisher/__tests__/fixtures/latex-pages/**'
      - 'ci/rich-content/**'
      - '.gitea/workflows/rich-content-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/authoring-contract/**'
      - 'apps/publisher/scripts/build-tenants.js'
      - 'apps/publisher/scripts/lib/latex-page-*.js'
      - 'apps/publisher/scripts/lib/mermaid-build-adapter.js'
      - 'apps/publisher/scripts/lib/plantuml-renderer.js'
      - 'apps/publisher/scripts/lib/renderer-security.js'
      - 'apps/publisher/__tests__/fixtures/latex-pages/**'
      - 'ci/rich-content/**'
      - '.gitea/workflows/rich-content-qualification.yml'
  workflow_dispatch:

concurrency:
  group: rich-content-qualification-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  external-renderers:
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Docker client
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends docker.io
          rm -rf /var/lib/apt/lists/*

      - name: Build locked renderer toolchain
        run: |
          set -euo pipefail
          docker build -f ci/rich-content/Dockerfile -t pagenary-rich-content:qualification .

      - name: Execute real adapter corpus offline
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=768m,mode=1777 \
            pagenary-rich-content:qualification
