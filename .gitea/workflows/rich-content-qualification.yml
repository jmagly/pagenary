name: Rich Content External Renderers

on:
  push:
    branches: [main]
    paths:
      - 'apps/publisher/scripts/lib/latex-page-*.js'
      - 'apps/publisher/scripts/lib/plantuml-renderer.js'
      - 'apps/publisher/scripts/lib/renderer-security.js'
      - 'apps/publisher/__tests__/fixtures/latex-pages/**'
      - 'ci/rich-content/**'
      - '.gitea/workflows/rich-content-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/publisher/scripts/lib/latex-page-*.js'
      - 'apps/publisher/scripts/lib/plantuml-renderer.js'
      - 'apps/publisher/scripts/lib/renderer-security.js'
      - 'apps/publisher/__tests__/fixtures/latex-pages/**'
      - 'ci/rich-content/**'
      - '.gitea/workflows/rich-content-qualification.yml'
  workflow_dispatch:

concurrency:
  group: rich-content-qualification-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  external-renderers:
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pinned base toolchain
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates=20260601~24.04.1 \
            curl=8.5.0-2ubuntu10.11 \
            fontconfig=2.15.0-1.1ubuntu2 \
            git=1:2.43.0-1ubuntu7.3 \
            graphviz=2.42.2-9ubuntu0.1 \
            latexml=0.8.8-1 \
            nodejs=18.19.1+dfsg-6ubuntu5 \
            openjdk-21-jre-headless=21.0.11+10-1~24.04.2 \
            pandoc=3.1.3+ds-2 \
            texlive-extra-utils=2023.20240207-1

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install checksum-verified renderer binaries
        run: |
          set -euo pipefail
          curl -fsSLo /opt/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.4/plantuml-mit-1.2026.4.jar
          echo '08588de4b505bd3f08fcc35bf2ca2fd9b7ec785e28203c5d6c57a7f05f4a00ff  /opt/plantuml.jar' | sha256sum -c -
          curl -fsSLo /tmp/tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-musl.tar.gz
          echo '60b13a0826ae7ad9ce34b4a2df06bff2cfcfa6dda8a915477c0cbb84e1a4a902  /tmp/tectonic.tar.gz' | sha256sum -c -
          tar -xzf /tmp/tectonic.tar.gz -C /usr/local/bin tectonic

      - name: Warm the pinned Tectonic bundle for offline qualification
        run: |
          set -euo pipefail
          mkdir -p /tmp/tectonic-warm
          cp apps/publisher/__tests__/fixtures/latex-pages/01-structure-math.tex /tmp/tectonic-warm/cache.tex
          tectonic -X compile --untrusted --outdir /tmp/tectonic-warm /tmp/tectonic-warm/cache.tex
          rm -rf /tmp/tectonic-warm

      - name: Execute real adapter corpus
        env:
          JAVA_PATH: /usr/bin/java
          PLANTUML_JAR: /opt/plantuml.jar
        run: node ci/rich-content/qualify.mjs
