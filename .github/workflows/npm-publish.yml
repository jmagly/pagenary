# Public npm Publishing to npmjs.org — runs on GitHub Actions
#
# Supply-chain split (see .aiwg / pagenary-release-pipeline):
#   - .gitea/workflows/npm-publish.yml  -> INTERNAL Gitea registry only
#   - THIS workflow (GitHub Actions)    -> PUBLIC npmjs.org
#
# The public packages are published from GitHub — not internal Gitea CI — so
# npm trusted publishing can attach provenance attestations linking the
# @pagenary packages to this source commit + build. That attestation is the
# supply-chain reason the public publish lives here.
#
# Triggered by the version tag that .gitea/workflows/release.yml mirrors to
# GitHub, or manually via workflow_dispatch.
#
# Publish enable gate (OFF by default):
#   NPMJS_PUBLISH_ENABLED (repo variable) must equal 'true' for this workflow
#   to actually publish. Until then it runs but only logs a skip notice — so a
#   mirrored tag never publishes a version to npmjs unexpectedly.
#
# Trusted publishing prerequisites:
#   1. Each package has npm Trusted Publisher configured for GitHub Actions:
#      owner jmagly, repository pagenary, workflow npm-publish.yml, action
#      "npm publish".
#   2. This GitHub repo is PUBLIC; npm does not generate provenance for private
#      repositories.
#   3. The workflow runs on a GitHub-hosted runner, has id-token: write, and uses
#      Node >=22.14.0 with npm >=11.5.1. This workflow uses pinned node:24.
#   4. package.json repository.url matches this GitHub repo — the publish job
#      rewrites it at runtime because committed metadata points at Gitea origin.

name: Publish to npmjs.org (public)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + pack, do not publish)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: npmjs-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # GitHub OIDC, required for npm trusted publishing

env:
  PUBLISH_PACKAGES: apps/blog-client apps/embed apps/publisher

jobs:
  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    container: node:24@sha256:c35698d36238c69451c7e7a5951dd5c9b11c3e45884c918059c94c4a8be969b1  # node 24.18.0, npm 11.16.0 (see ci/digests.txt)
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify trusted-publishing runtime
        run: |
          set -o pipefail
          node -e "const [major,minor]=process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) { throw new Error('npm trusted publishing requires Node >=22.14.0') }"
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package versions
        if: ${{ github.event_name == 'push' }}
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./apps/publisher/package.json').version")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: tag ($TAG) != apps/publisher/package.json ($VERSION)"; exit 1
          fi
          for pkg in $PUBLISH_PACKAGES; do
            PKG_VERSION=$(node -p "require('./${pkg}/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "Error: ${pkg}/package.json ($PKG_VERSION) does not match apps/publisher/package.json ($VERSION)"
              exit 1
            fi
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const version = require('./apps/publisher/package.json').version;
          for (const pkg of process.env.PUBLISH_PACKAGES.split(/\s+/).filter(Boolean)) {
            const json = JSON.parse(fs.readFileSync(`${pkg}/package.json`, 'utf8'));
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              for (const [name, range] of Object.entries(json[section] || {})) {
                if (name.startsWith('@pagenary/') && range !== version) {
                  throw new Error(`${pkg} ${section}.${name} must equal ${version}, found ${range}`);
                }
              }
            }
          }
          NODE
          echo "Publishing @pagenary packages @$VERSION to npmjs.org"

      - name: Audit tarball top-level entries
        run: |
          set -o pipefail
          for pkg in $PUBLISH_PACKAGES; do
            base=$(basename "$pkg")
            allowlist="ci/expected-tarball-top-level.${base}.txt"
            if [ "$base" = "publisher" ]; then
              allowlist="ci/expected-tarball-top-level.txt"
            fi
            ACTUAL=$(cd "$pkg" && npm pack --dry-run --json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const t=[...new Set((j[0].files||[]).map(f=>f.path.split('/')[0]))].sort();console.log(t.join('\n'))})")
            EXPECTED=$(grep -vE '^\s*(#|$)' "$allowlist" | sort)
            UNEXPECTED=$(comm -23 <(echo "$ACTUAL") <(echo "$EXPECTED"))
            if [ -n "$UNEXPECTED" ]; then
              echo "FATAL: unexpected top-level entries in ${pkg} tarball:"
              echo "$UNEXPECTED"
              echo "If intentional, add them to ${allowlist} with a rationale."
              exit 1
            fi
            echo "✓ ${pkg} tarball top-level matches ${allowlist}"
          done

      - name: Verify .aiwg/ excluded from packages
        run: |
          set -o pipefail
          for pkg in $PUBLISH_PACKAGES; do
            (cd "$pkg" && npm pack --dry-run 2>&1) | tee "pack-output-$(basename "$pkg").txt"
            if grep -qE '(^|/)\.aiwg/' "pack-output-$(basename "$pkg").txt"; then
              echo "FATAL: .aiwg/ found in ${pkg} package contents — must never be published."
              exit 1
            fi
            echo "✓ ${pkg} excludes .aiwg/"
          done

      - name: Route @pagenary scope to npmjs
        # In this workspace repo npm reads the repo-root .npmrc as project
        # config. The committed root .npmrc routes @pagenary to the internal
        # Gitea registry — drop that line so the scoped package uses the
        # npmjs default registry. Authentication comes from npm trusted
        # publishing/OIDC during `npm publish`, not a long-lived token.
        run: |
          set -o pipefail
          sed -i '/@pagenary:registry/d' .npmrc

      - name: Point repository.url at this GitHub repo (provenance match)
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const dir of process.env.PUBLISH_PACKAGES.split(/\s+/).filter(Boolean)) {
            const f = `${dir}/package.json`;
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.repository = {
              type: 'git',
              url: `git+${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}.git`,
              directory: dir
            };
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            console.log(`${p.name} repository.url -> ${p.repository.url}`);
          }
          NODE

      - name: Publish skipped (not enabled)
        if: ${{ vars.NPMJS_PUBLISH_ENABLED != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "npmjs publish is DISABLED. Set repo variable NPMJS_PUBLISH_ENABLED=true to enable."
          echo "Recommended order: make the repo PUBLIC -> configure npm trusted publishers -> NPMJS_PUBLISH_ENABLED=true."

      - name: Publish to npmjs.org
        if: ${{ vars.NPMJS_PUBLISH_ENABLED == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          set -o pipefail
          echo "Publishing via npm trusted publishing/OIDC; provenance is automatic for public packages in public repos."
          for pkg in $PUBLISH_PACKAGES; do
            name=$(node -p "require('./${pkg}/package.json').name")
            echo "Publishing ${name} to npmjs.org"
            (cd "$pkg" && npm publish --registry=https://registry.npmjs.org/ --access public 2>&1) | tee "publish-output-$(basename "$pkg").txt" || {
              if grep -qE "cannot publish over the previously published|EPUBLISHCONFLICT|previously published versions" "publish-output-$(basename "$pkg").txt"; then
                echo "✓ ${name} version already on npmjs.org — treating as success"
              else
                echo "✗ ${name} npmjs.org publish failed"; cat "publish-output-$(basename "$pkg").txt"; exit 1
              fi
            }
          done

      - name: Dry run — pack only
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          for pkg in $PUBLISH_PACKAGES; do
            (cd "$pkg" && npm pack --pack-destination "$GITHUB_WORKSPACE")
          done
          ls -la *.tgz
