<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Pagenary publishing pipeline: author, build, deploy.">
  <title>Pagenary publishing pipeline</title>
  <rect width="720" height="300" fill="#f7f8fa"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g>
      <rect x="40" y="110" width="160" height="80" rx="12" fill="#ffffff" stroke="#d7dbe0"/>
      <text x="120" y="145" font-size="20" font-weight="700" fill="#0b1220">Author</text>
      <text x="120" y="170" font-size="13" fill="#5b6472">Markdown · HTML · JS</text>
    </g>
    <g>
      <rect x="280" y="110" width="160" height="80" rx="12" fill="#ffffff" stroke="#d7dbe0"/>
      <text x="360" y="145" font-size="20" font-weight="700" fill="#0b1220">Build</text>
      <text x="360" y="170" font-size="13" fill="#5b6472">Templates · tokens · search</text>
    </g>
    <g>
      <rect x="520" y="110" width="160" height="80" rx="12" fill="#0b1220"/>
      <text x="600" y="145" font-size="20" font-weight="700" fill="#ffffff">Deploy</text>
      <text x="600" y="170" font-size="13" fill="#c7ccd4">Static files · anywhere</text>
    </g>
    <!-- arrows -->
    <g stroke="#9aa2ad" stroke-width="2" fill="none">
      <path d="M200 150 H272" marker-end="url(#a)"/>
      <path d="M440 150 H512" marker-end="url(#a)"/>
    </g>
    <text x="360" y="58" font-size="15" font-weight="600" fill="#5b6472">One Markdown folder, one static build</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
</svg>
